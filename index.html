<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공무 도구 by유재성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f4efe9; --card: #f7f3ee; --ink: #2f2d2b; --ink-2: #7a726b; --clay: #c4553a; --clay-ink: #fff8f3;
  --sh-dark: rgba(166,146,128,.38); --sh-light: rgba(255,255,255,.95);
  --font: "IBM Plex Sans KR", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #23201e; --card: #262321; --ink: #efe8e1; --ink-2: #aaa098; --clay: #e0704f; --clay-ink: #2a1610;
    --sh-dark: rgba(0,0,0,.5); --sh-light: rgba(255,255,255,.045); color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 820px; margin: 0 auto; padding: 48px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 28px; }
h1 { margin: 0; font-size: clamp(30px, 6vw, 44px); font-weight: 500; letter-spacing: .08em; }
h1 .sl { color: var(--clay); font-weight: 400; margin: 0 .12em; }
.tagline { font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--ink-2); margin-top: 8px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
@media (max-width: 620px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
a.tile { display: flex; align-items: center; gap: 20px; padding: 24px; border-radius: 18px; background: var(--card); color: inherit; text-decoration: none;
  box-shadow: 7px 7px 16px var(--sh-dark), -7px -7px 16px var(--sh-light); transition: transform .12s; }
a.tile:hover { transform: translateY(-2px); }
a.tile:active { transform: none; box-shadow: inset 4px 4px 10px var(--sh-dark), inset -4px -4px 10px var(--sh-light); }
a.tile:focus-visible { outline: 2px solid var(--clay); outline-offset: 4px; }
.ic { width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--clay); color: var(--clay-ink);
  box-shadow: 4px 4px 10px var(--sh-dark), -4px -4px 10px var(--sh-light); }
.ic svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.t { font-size: 18px; font-weight: 500; }
.d { font-size: 13px; color: var(--ink-2); }
footer { font-size: 12px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>공무<span class="sl">/</span>도구</h1>
    <div class="tagline">Site office tools · by유재성</div>
  </header>
  <nav class="tiles">
    <a class="tile" href="/rebar/">
      <span class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M8 5v4M12 5v4M16 5v4M20 9h2M20 13h2M20 17h2"/></svg></span>
      <span><span class="t">벽체 철근 개수 산정</span><br><span class="d">H 앵커 · V U바 개수와 배치도, 3D 보기</span></span>
    </a>
    <a class="tile" href="/eps2png/">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14l2 2 4-4"/></svg></span>
      <span><span class="t">EPS·PDF 투명 PNG 변환기</span><br><span class="d">AutoCAD EPS·PDF를 투명 PNG로 변환</span></span>
    </a>
  </nav>
  <footer>입력값과 파일은 모두 각자의 브라우저 안에서만 처리되고 서버로 전송되지 않습니다.</footer>
</div>
</body>
</html>
