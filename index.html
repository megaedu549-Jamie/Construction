<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jamie's workspace by유재성</title>
<meta name="description" content="현장 사무실용 도구와 인테리어·건축 포트폴리오 · 유재성">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #C9432C;
    --paper: #F4F1EC;
    --ink: #FFFFFF;
    --mute: rgba(255,255,255,.72);
    --side: clamp(20px, 5vw, 72px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #141414; color: var(--ink);
    font: 400 15px/1.5 'Inter', 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .stage { position: relative; height: 100vh; height: 100svh; min-height: 620px; overflow: hidden; }

  /* background layers */
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transform: scale(1.06); transition: opacity .9s ease, transform 6s ease; }
  .bg.on { opacity: 1; transform: scale(1); }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(12,12,12,.86) 0%, rgba(12,12,12,.55) 45%, rgba(12,12,12,.15) 100%), linear-gradient(0deg, rgba(12,12,12,.7) 0%, rgba(12,12,12,0) 40%); }

  /* nav */
  .nav { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 24px var(--side); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .02em; }
  .logo i { width: 22px; height: 22px; border: 2px solid #fff; border-radius: 50%; display: inline-block; position: relative; }
  .logo i::after { content: ''; position: absolute; left: 50%; top: 2px; bottom: 2px; width: 2px; background: #fff; transform: translateX(-50%) rotate(30deg); }
  .logo small { font-weight: 400; color: var(--mute); margin-left: 4px; }
  .links { display: flex; gap: 28px; font-size: 13px; letter-spacing: .06em; }
  .links a { color: var(--mute); padding-bottom: 6px; border-bottom: 2px solid transparent; }
  .links a:hover { color: #fff; }
  .links a.cur { color: #fff; border-color: var(--accent); }

  /* left copy */
  .copy { position: absolute; z-index: 4; left: var(--side); top: 50%; transform: translateY(-46%); width: min(560px, 44vw); }
  .eyebrow { display: flex; align-items: center; gap: 12px; color: var(--mute); font-size: 14px; }
  .eyebrow::before { content: ''; width: 28px; height: 2px; background: #fff; }
  .title { font-family: 'Oswald', 'Noto Sans KR', sans-serif; font-weight: 600; text-transform: uppercase; font-size: clamp(48px, 7vw, 104px); line-height: .98; letter-spacing: .005em; margin: 14px 0 18px; word-break: keep-all; }
  .desc { color: var(--mute); max-width: 420px; margin: 0 0 28px; }
  .ctas { display: flex; align-items: center; gap: 14px; }
  .go { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; transition: transform .2s; }
  .go:hover { transform: scale(1.08); }
  .go svg { width: 18px; height: 18px; }
  .open { height: 46px; padding: 0 24px; border: 1px solid rgba(255,255,255,.5); border-radius: 999px; display: inline-flex; align-items: center; font-size: 13px; letter-spacing: .08em; }
  .open:hover { background: #fff; color: #141414; }
  .swap .eyebrow, .swap .title, .swap .desc, .swap .ctas { animation: up .7s cubic-bezier(.2,.7,.2,1) both; }
  .swap .title { animation-delay: .06s; } .swap .desc { animation-delay: .12s; } .swap .ctas { animation-delay: .18s; }
  @keyframes up { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

  /* cards */
  .cards { position: absolute; z-index: 4; left: 50%; right: 0; top: 50%; transform: translateY(-40%); display: flex; gap: 20px; padding-left: 20px; }
  .card { position: relative; flex: 0 0 auto; width: clamp(150px, 13vw, 210px); aspect-ratio: 2 / 3; border-radius: 16px; overflow: hidden; background: #333 center / cover; box-shadow: 0 18px 40px rgba(0,0,0,.35); text-align: left; transition: transform .35s ease; animation: cardin .6s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 70ms); }
  .card:hover { transform: translateY(-8px); }
  .card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,0) 60%); }
  .card span { position: absolute; z-index: 1; left: 14px; right: 14px; bottom: 14px; }
  .card em { display: block; font-style: normal; font-size: 11px; color: var(--mute); margin-bottom: 4px; }
  .card b { display: block; font-family: 'Oswald', 'Noto Sans KR', sans-serif; font-weight: 500; text-transform: uppercase; font-size: 18px; line-height: 1.1; }
  @keyframes cardin { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }

  /* bottom controls */
  .ctrl { position: absolute; z-index: 4; left: 50%; right: var(--side); bottom: clamp(28px, 6vh, 56px); display: flex; align-items: center; gap: 14px; padding-left: 20px; }
  .arrow { width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,.5); display: grid; place-items: center; }
  .arrow:hover { background: rgba(255,255,255,.15); }
  .arrow svg { width: 16px; height: 16px; }
  .bar { flex: 1; height: 2px; background: rgba(255,255,255,.25); margin: 0 12px; position: relative; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); }
  .bar i.run { animation: fill var(--dur) linear forwards; }
  @keyframes fill { to { width: 100%; } }
  .num { font-family: 'Oswald', sans-serif; font-size: 40px; font-weight: 500; line-height: 1; min-width: 56px; text-align: right; }

  .note { position: absolute; z-index: 4; left: var(--side); bottom: clamp(28px, 6vh, 56px); font-size: 12px; color: rgba(255,255,255,.55); max-width: 40vw; }

  @media (max-width: 860px) {
    .links { gap: 16px; font-size: 12px; }
    .links .hide-m { display: none; }
    .logo small { display: none; }
    .copy { top: 22%; transform: none; width: auto; right: var(--side); }
    .title { font-size: clamp(40px, 12vw, 64px); }
    .desc { margin-bottom: 20px; }
    .cards { left: 0; top: auto; bottom: 120px; transform: none; padding: 0 var(--side); gap: 12px; overflow-x: auto; scrollbar-width: none; }
    .cards::-webkit-scrollbar { display: none; }
    .card { width: 128px; border-radius: 12px; }
    .card b { font-size: 15px; }
    .ctrl { left: var(--side); padding: 0; bottom: 40px; }
    .note { display: none; }
    .shade { background: linear-gradient(180deg, rgba(12,12,12,.55) 0%, rgba(12,12,12,.75) 55%, rgba(12,12,12,.9) 100%); }
  }
</style>
</head>
<body>

<main class="stage" id="stage" aria-roledescription="carousel">
  <div class="bg" id="bgA"></div>
  <div class="bg" id="bgB"></div>
  <div class="shade"></div>

  <header class="nav">
    <a class="logo" href="/"><i></i>공무/도구 <small>by 유재성</small></a>
    <nav class="links">
      <a class="cur" href="/">HOME</a>
      <a href="/portfolio/">PORTFOLIO</a>
      <a class="hide-m" href="/rebar/">철근 산정</a>
      <a class="hide-m" href="/eps2png/">EPS·PDF → PNG</a>
    </nav>
  </header>

  <section class="copy" id="copy" aria-live="polite">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 class="title" id="title"></h1>
    <p class="desc" id="desc"></p>
    <div class="ctas">
      <a class="go" id="go" href="#" aria-label="열기"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      <a class="open" id="open" href="#">OPEN</a>
    </div>
  </section>

  <div class="cards" id="cards"></div>

  <div class="ctrl">
    <button class="arrow" id="prev" aria-label="이전"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="arrow" id="next" aria-label="다음"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="bar"><i id="prog"></i></div>
    <div class="num" id="num">01</div>
  </div>

  <p class="note">도구의 입력값과 파일은 각자의 브라우저 안에서만 처리되며 서버로 전송되지 않습니다.</p>
</main>

<script>
  var slides = [
    { tag: 'Tool · Site office', title: '벽체<br>철근 산정', desc: 'H 앵커 · V U바 개수와 배치도, 3D 보기', href: '/rebar/', img: 'home-img/rebar.jpg' },
    { tag: 'Tool · AutoCAD', title: 'EPS · PDF<br>→ PNG', desc: 'AutoCAD EPS · PDF를 투명 PNG로 변환', href: '/eps2png/', img: 'home-img/eps2png.jpg' },
    { tag: 'Interior · Ulsan', title: 'Mars<br>Roasters', desc: 'Cafe · 150㎡', href: '/portfolio/#interior', img: 'portfolio/img/mars-w.jpg' },
    { tag: 'Interior · Ulsan', title: 'Skunk<br>Works', desc: 'Cafe · 660㎡', href: '/portfolio/#interior', img: 'portfolio/img/skunk-r2.jpg' },
    { tag: 'Interior · Ulsan', title: 'Hanbok<br>Nara', desc: 'Hanbok store · 198㎡', href: '/portfolio/#interior', img: 'portfolio/img/hb-r1.jpg' },
    { tag: 'Plant · Haiphong, Vietnam', title: 'H3<br>Project', desc: 'Planning · Elevation · Approval', href: '/portfolio/#plant', img: 'portfolio/img/h3-1.jpg' }
  ];
  var DUR = 6500, cur = 0, timer = null, layer = 0;
  var bgs = [document.getElementById('bgA'), document.getElementById('bgB')];
  var $ = function (id) { return document.getElementById(id); };
  document.documentElement.style.setProperty('--dur', DUR + 'ms');

  slides.forEach(function (s) { var im = new Image(); im.src = s.img; });

  function show(i) {
    cur = (i + slides.length) % slides.length;
    var s = slides[cur];
    var next = bgs[1 - layer], prev = bgs[layer];
    next.style.backgroundImage = 'url(' + s.img + ')';
    next.classList.add('on'); prev.classList.remove('on'); layer = 1 - layer;

    var copy = $('copy'); copy.classList.remove('swap'); void copy.offsetWidth; copy.classList.add('swap');
    $('eyebrow').textContent = s.tag;
    $('title').innerHTML = s.title;
    $('desc').textContent = s.desc;
    $('go').href = s.href; $('open').href = s.href;
    $('num').textContent = String(cur + 1).padStart(2, '0');

    var html = '';
    for (var k = 1; k <= 4; k++) {
      var j = (cur + k) % slides.length, c = slides[j];
      html += '<button class="card" style="--i:' + k + ';background-image:url(' + c.img + ')" data-i="' + j + '" aria-label="' + c.title.replace('<br>', ' ') + '"><span><em>' + c.tag + '</em><b>' + c.title + '</b></span></button>';
    }
    $('cards').innerHTML = html;

    var p = $('prog'); p.classList.remove('run'); void p.offsetWidth; p.classList.add('run');
    clearTimeout(timer); timer = setTimeout(function () { show(cur + 1); }, DUR);
  }

  $('next').onclick = function () { show(cur + 1); };
  $('prev').onclick = function () { show(cur - 1); };
  $('cards').onclick = function (e) { var b = e.target.closest('.card'); if (b) show(+b.dataset.i); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') show(cur + 1);
    if (e.key === 'ArrowLeft') show(cur - 1);
  });
  var sx = null;
  $('stage').addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  $('stage').addEventListener('touchend', function (e) {
    if (sx === null) return; var dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 50 && !e.target.closest('.cards')) show(cur + (dx < 0 ? 1 : -1)); sx = null;
  });
  show(0);
</script>
</body>
</html>
